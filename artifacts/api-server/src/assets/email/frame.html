<!doctype html>
<html
  lang="en-GB"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
    <title>{{title}}</title>
    <!-- Keep the Outlook conditional delimiters intact. Splitting them can hide the email body. -->
    <!-- prettier-ignore -->
    <!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->
    <style>
      html,
      body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      table {
        border-collapse: collapse;
      }
      img {
        border: 0;
        outline: none;
        text-decoration: none;
        -ms-interpolation-mode: bicubic;
      }
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
      }
      @media only screen and (max-width: 620px) {
        .outer {
          padding: 0 !important;
        }
        .pad {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }
        .hero-title {
          font-size: 32px !important;
          line-height: 1.15 !important;
        }
        .brand-date {
          font-size: 12px !important;
        }
        .footer-pad {
          padding: 24px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #eef2f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #101c2e;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    "
  >
    <div
      style="
        display: none;
        font-size: 1px;
        color: #eef2f6;
        line-height: 1px;
        max-height: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        mso-hide: all;
      "
    >
      {{preheader}}
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      bgcolor="#eef2f6"
      style="width: 100%; background: #eef2f6"
    >
      <tr>
        <td class="outer" align="center" style="padding: 32px 12px">
          <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            bgcolor="#ffffff"
            style="width: 100%; max-width: 600px; background: #ffffff"
          >
            <tr>
              <td
                height="5"
                bgcolor="#004eb9"
                style="height: 5px; line-height: 5px; font-size: 1px; background: #004eb9"
              >
                &nbsp;
              </td>
            </tr>
            <tr>
              <td class="pad" style="padding: 28px 40px 26px">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="width: 100%; table-layout: fixed"
                >
                  <tr>
                    <td width="50%" align="left" valign="top" style="width: 50%">
                      <img
                        src="cid:swp-transactional-v2@swpsummit.com"
                        width="84"
                        height="84"
                        alt="SWP Summit"
                        style="
                          display: block;
                          width: 84px;
                          height: 84px;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 13px;
                          color: #004eb9;
                        "
                      />
                    </td>
                    <td width="50%" align="right" valign="top" style="width: 50%">
                      <img
                        src="cid:psh-transactional-v2@swpsummit.com"
                        width="84"
                        height="84"
                        alt="People Strategy Hub"
                        style="
                          display: block;
                          width: 84px;
                          height: 84px;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 12px;
                          color: #000000;
                        "
                      />
                    </td>
                  </tr>
                  <tr>
                    <td
                      class="brand-date"
                      align="left"
                      valign="top"
                      style="
                        padding-top: 12px;
                        padding-right: 8px;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 13px;
                        line-height: 1.6;
                        color: #101c2e;
                      "
                    >
                      <strong>{{eventName}}</strong><br /><span style="color: #4a5568"
                        >{{headerEventDate}}</span
                      >
                    </td>
                    <td
                      class="brand-date"
                      align="right"
                      valign="top"
                      style="
                        padding-top: 12px;
                        padding-left: 8px;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 13px;
                        line-height: 1.6;
                        color: #101c2e;
                      "
                    >
                      <span style="color: #4a5568">An event by</span><br /><strong
                        >People Strategy Hub</strong
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            {{content}}
            <tr>
              <td class="footer-pad" style="padding: 28px 40px; border-top: 1px solid #e2e8f0">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td width="84" valign="top" style="width: 84px">
                      <img
                        src="cid:psh-transactional-v2@swpsummit.com"
                        width="84"
                        height="84"
                        alt="People Strategy Hub"
                        style="
                          display: block;
                          width: 84px;
                          height: 84px;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 12px;
                          color: #000000;
                        "
                      />
                    </td>
                    <td
                      valign="middle"
                      style="
                        padding-left: 22px;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 12px;
                        line-height: 1.7;
                        color: #4a5568;
                      "
                    >
                      An event by<br /><strong style="font-size: 14px; color: #101c2e"
                        >People Strategy Hub</strong
                      ><br />London, United Kingdom<br /><a
                        href="https://www.peoplestrategyhub.com"
                        style="color: #4a5568; text-decoration: underline"
                        >peoplestrategyhub.com</a
                      >
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 20px 0 0;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 11px;
                    line-height: 1.6;
                    color: #4a5568;
                  "
                >
                  © 2027 SWP Summit. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
