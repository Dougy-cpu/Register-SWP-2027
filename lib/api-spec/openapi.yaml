openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SWP Summit Conference Registration API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bookings
    description: Conference registration bookings
  - name: attendees
    description: Attendee details management
  - name: pricing
    description: Pricing and discount calculations
  - name: promo-codes
    description: Promo code management
  - name: discount-tiers
    description: Group discount tier management
  - name: stripe
    description: Stripe payment operations
  - name: email
    description: Email template and log management
  - name: admin
    description: Admin panel operations
  - name: calendar
    description: Public iCalendar (.ics) downloads for the event and pre-event social
  - name: sponsors-admin
    description: Sponsor administration, review, communications and reporting
  - name: sponsor-workspace
    description: Cookie-authenticated private sponsor workspace
paths:
  /calendar/main.ics:
    get:
      operationId: downloadMainCalendarIcs
      tags: [calendar]
      summary: Download .ics file for the main event
      description: |
        Returns an RFC-5545 iCalendar file for the main summit event. Public
        endpoint — no authentication. Returns 404 with a plain-text body when
        the event start/end times have not been configured in admin settings.
      responses:
        "200":
          description: iCalendar file
          content:
            text/calendar:
              schema:
                type: string
        "404":
          description: Event schedule not configured
          content:
            text/plain:
              schema:
                type: string

  /calendar/social.ics:
    get:
      operationId: downloadSocialCalendarIcs
      tags: [calendar]
      summary: Download .ics file for the pre-event social
      description: |
        Returns an RFC-5545 iCalendar file for the optional pre-event social.
        Public endpoint — no authentication. Returns 404 with a plain-text
        body when the social is not enabled or its times are unset.
      responses:
        "200":
          description: iCalendar file
          content:
            text/calendar:
              schema:
                type: string
        "404":
          description: Social not enabled or not configured
          content:
            text/plain:
              schema:
                type: string

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ==================== BOOKINGS ====================
  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking (or upsert by session token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingWithAttendees"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update booking details (payment method, promo code, step progress)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingBody"
      responses:
        "200":
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/by-session/{sessionToken}:
    get:
      operationId: getBookingBySession
      tags: [bookings]
      summary: Get or create a booking by session token
      parameters:
        - name: sessionToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking found or created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingWithAttendees"

  /bookings/{id}/pricing:
    get:
      operationId: getBookingPricing
      tags: [pricing]
      summary: Get pricing breakdown for a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: promoCode
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Pricing breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingBreakdown"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== ATTENDEES ====================
  /bookings/{bookingId}/attendees:
    post:
      operationId: createAttendee
      tags: [attendees]
      summary: Add an attendee to a booking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttendeeBody"
      responses:
        "201":
          description: Attendee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{bookingId}/attendees/{attendeeId}:
    patch:
      operationId: updateAttendee
      tags: [attendees]
      summary: Update an attendee's details
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
        - name: attendeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttendeeBody"
      responses:
        "200":
          description: Attendee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== PRICING ====================
  /pricing/calculate:
    post:
      operationId: calculatePricing
      tags: [pricing]
      summary: Calculate pricing for a given pass type and quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingRequest"
      responses:
        "200":
          description: Pricing breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingBreakdown"

  # ==================== PROMO CODES ====================
  /promo-codes/validate:
    post:
      operationId: validatePromoCode
      tags: [promo-codes]
      summary: Validate a promo code for a given booking context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidatePromoCodeBody"
      responses:
        "200":
          description: Promo code is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeValidationResult"
        "400":
          description: Invalid or expired promo code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/promo-codes:
    get:
      operationId: listPromoCodes
      tags: [promo-codes]
      summary: List all promo codes (admin)
      security:
        - AdminToken: []
      responses:
        "200":
          description: List of promo codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromoCode"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createPromoCode
      tags: [promo-codes]
      summary: Create a promo code (admin)
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromoCodeBody"
      responses:
        "201":
          description: Promo code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCode"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/promo-codes/{id}:
    patch:
      operationId: updatePromoCode
      tags: [promo-codes]
      summary: Update a promo code (admin)
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromoCodeBody"
      responses:
        "200":
          description: Promo code updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePromoCode
      tags: [promo-codes]
      summary: Delete a promo code (admin)
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== DISCOUNT TIERS ====================
  /discount-tiers:
    get:
      operationId: listDiscountTiers
      tags: [discount-tiers]
      summary: List group discount tiers for all pass types
      responses:
        "200":
          description: List of discount tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscountTier"

  /admin/discount-tiers:
    put:
      operationId: updateDiscountTiers
      tags: [discount-tiers]
      summary: Replace all discount tiers for a pass type (admin)
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiscountTiersBody"
      responses:
        "200":
          description: Tiers updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscountTier"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== STRIPE ====================
  /stripe/create-checkout-session:
    post:
      operationId: createStripeCheckoutSession
      tags: [stripe]
      summary: Create a Stripe Checkout session for a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStripeSessionBody"
      responses:
        "200":
          description: Stripe session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeSessionResponse"
        "400":
          description: Invalid booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stripe/confirm-card-payment:
    post:
      operationId: confirmCardPayment
      tags: [stripe]
      summary: Confirm a card payment after Stripe Checkout redirect and trigger fulfillment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmCardPaymentBody"
      responses:
        "200":
          description: Payment confirmed or already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmCardPaymentResponse"
        "400":
          description: Payment not completed or missing params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — invalid booking session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stripe/webhook:
    post:
      operationId: stripeWebhook
      tags: [stripe]
      summary: Handle Stripe webhook events
      responses:
        "200":
          description: Webhook received

  /stripe/create-invoice:
    post:
      operationId: createStripeInvoice
      tags: [stripe]
      summary: Create a Stripe invoice for a booking (invoice payment route)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "200":
          description: Invoice created and sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          description: Invalid booking or Stripe error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== EMAIL TEMPLATES ====================
  /email-templates/welcome:
    get:
      operationId: getWelcomeEmailTemplate
      tags: [email]
      summary: Get the current welcome email template
      responses:
        "200":
          description: Welcome email template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
    put:
      operationId: updateWelcomeEmailTemplate
      tags: [email]
      summary: Update the welcome email template (admin)
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmailTemplateBody"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /email-templates/welcome/test-send:
    post:
      operationId: sendTestWelcomeEmail
      tags: [email]
      summary: Send a test welcome email to a specified address
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailBody"
      responses:
        "200":
          description: Test email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /email-templates/community_social:
    get:
      operationId: getCommunitySocialEmailTemplate
      tags: [email]
      summary: Get the Community Social email template
      security:
        - AdminToken: []
      responses:
        "200":
          description: Community Social email template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
    put:
      operationId: updateCommunitySocialEmailTemplate
      tags: [email]
      summary: Update the Community Social email template
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmailTemplateBody"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /email-templates/community_social/test-send:
    post:
      operationId: sendTestCommunitySocialEmail
      tags: [email]
      summary: Send a test Community Social email
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailBody"
      responses:
        "200":
          description: Test email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== EMAIL LOGS ====================
  /admin/email-logs:
    get:
      operationId: listEmailLogs
      tags: [email]
      summary: List all email logs (admin)
      security:
        - AdminToken: []
      parameters:
        - name: bookingId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Email logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLogList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/email-logs/{bookingId}/resend:
    post:
      operationId: resendBookingEmails
      tags: [email]
      summary: Resend confirmation + receipt emails for a booking
      security:
        - AdminToken: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Emails resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/bookings/{bookingId}/send-invoice-reminder:
    post:
      operationId: sendInvoiceReminder
      tags: [email]
      summary: Send invoice payment reminder email to the billing contact
      security:
        - AdminToken: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reminder email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to send reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== UNPAID INVOICES WIDGET ====================
  /admin/unpaid-invoices/summary:
    get:
      operationId: getUnpaidInvoicesSummary
      tags: [admin]
      summary: Aging-bucket summary of unpaid invoices for the admin dashboard
      security:
        - AdminToken: []
      responses:
        "200":
          description: Bucket counts and totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnpaidInvoicesSummary"

  /admin/unpaid-invoices:
    get:
      operationId: listUnpaidInvoices
      tags: [admin]
      summary: List unpaid invoice bookings, optionally filtered by aging bucket
      security:
        - AdminToken: []
      parameters:
        - name: bucket
          in: query
          required: false
          schema:
            type: string
            enum: ["0-7", "8-14", "15+"]
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [daysOutstanding, totalAmount, lastReminder, orderReference]
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Page of unpaid invoice rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnpaidInvoiceList"

  /admin/unpaid-invoices/bulk-remind:
    post:
      operationId: bulkRemindUnpaidInvoices
      tags: [admin]
      summary: Send invoice reminder emails to every booking in the 15+ days bucket
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRemindBody"
      responses:
        "200":
          description: Bulk send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkRemindResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== ADMIN ====================
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login — validate password and return session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/registrations:
    get:
      operationId: listRegistrations
      tags: [admin]
      summary: List all registrations (admin)
      security:
        - AdminToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: passType
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Case-insensitive search across attendee name, email, company, job title, organiser notes, booking reference and applied promo code.
          schema:
            type: string
        - name: needsAttention
          in: query
          required: false
          description: When true, only return confirmed (paid or invoiced) bookings with at least one undelivered confirmation side-effect.
          schema:
            type: string
            enum: ["true", "false", "1", "0"]
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of registrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createManualRegistration
      tags: [admin]
      summary: Add a direct-invoice delegate manually (admin)
      description: |
        Creates a one-person registration without running the public checkout,
        creating a Stripe invoice, or sending automatic emails. Current pass
        pricing and VAT are recorded, and the entry is labelled as manual.
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualRegistrationBody"
      responses:
        "201":
          description: Manual registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookingWithAttendees"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/registrations/{id}/redeliver:
    post:
      operationId: redeliverRegistration
      tags: [admin]
      summary: Re-run any unfinished post-confirmation side-effects (admin)
      description: |
        Retries the confirmation email, welcome emails, organiser notification,
        and Sheets sync for any flag that is still false on a paid/invoiced booking.
        Each side-effect is gated on its own boolean flag, so already-delivered
        ones are skipped. Use after fixing an SMTP / Sheets outage to clear the
        "needs attention" badge.
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated registration with redelivery summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationRedeliveryResult"
        "400":
          description: Booking is not yet confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/registrations/{id}/resend-confirmation-email:
    post:
      operationId: resendRegistrationConfirmationEmail
      tags: [admin]
      summary: Resend the customer confirmation email (admin)
      description: |
        Sends a fresh confirmation and receipt email for a paid or invoiced
        booking. This does not run organiser notification or Sheets sync.
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated registration with resend summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationEmailResendResult"
        "400":
          description: Booking is not yet confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No lead attendee email is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/registrations/{id}/resend-welcome-emails:
    post:
      operationId: resendRegistrationWelcomeEmails
      tags: [admin]
      summary: Resend attendee welcome emails (admin)
      description: |
        Sends fresh welcome emails to every non-TBC attendee on a paid or
        invoiced booking. This does not run organiser notification or Sheets sync.
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated registration with resend summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationEmailResendResult"
        "400":
          description: Booking is not yet confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No attendee email addresses are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: One or more emails could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/registrations/{id}/send-community-social-email:
    post:
      operationId: sendRegistrationCommunitySocialEmail
      tags: [admin]
      summary: Send the Community Social email to attendees (admin)
      description: |
        Manually sends the Community Social email to every non-TBC attendee on
        a paid or invoiced booking. This endpoint is not part of automatic
        booking confirmation, redelivery, organiser notification or Sheets sync.
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated registration with send summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationEmailResendResult"
        "400":
          description: Booking is not yet confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Community Social settings or attendee email addresses are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: One or more emails could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/registrations/{id}/status:
    patch:
      operationId: updateRegistrationStatus
      tags: [admin]
      summary: Override registration status (admin)
      description: |
        Updates the local booking status. When an invoice booking with a
        Stripe invoice is marked paid, the server first syncs Stripe by paying
        open invoices with `paid_out_of_band: true`. If Stripe is unavailable
        or the invoice cannot be marked paid, the local booking status is not
        changed.
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRegistrationStatusUpdateBody"
      responses:
        "200":
          description: Updated registration with Stripe side-effect result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistrationStatusUpdateResult"
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stripe invoice is not payable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistrationStatusErrorResponse"
        "502":
          description: Stripe invoice update failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistrationStatusErrorResponse"
        "503":
          description: Stripe is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistrationStatusErrorResponse"

  /admin/registrations/{id}:
    get:
      operationId: getRegistration
      tags: [admin]
      summary: Get a registration with full attendee details (admin)
      security:
        - AdminToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration with attendees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookingWithAttendees"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/registrations/export:
    get:
      operationId: exportRegistrations
      tags: [admin]
      summary: Export registrations as CSV (admin)
      security:
        - AdminToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /admin/registrations/export/scheduler:
    get:
      operationId: exportSessionSchedulerAttendees
      tags: [admin]
      summary: Export eligible attendees for Session Scheduler (admin)
      description: |
        Generates a fresh Excel workbook containing every non-TBC attendee
        attached to a paid or invoiced booking. The worksheet columns are Name,
        Email, Company and Job Title. This export is independent of the filters
        on the registrations page.
      security:
        - AdminToken: []
      responses:
        "200":
          description: Session Scheduler attendee workbook
          headers:
            Content-Disposition:
              description: Download filename for the generated workbook
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /event-settings/public:
    get:
      operationId: getPublicEventSettings
      tags: [public]
      summary: Public subset of event settings
      description: |
        Returns the public-facing copy required by the checkout, currently the
        How-invoicing-works help content shown on Step 4 (Pay by Invoice).
        No authentication required.
      responses:
        "200":
          description: Public event settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventSettings"

  /admin/event-settings:
    get:
      operationId: getAdminEventSettings
      tags: [admin]
      summary: Get event/organisation settings (admin)
      security:
        - AdminToken: []
      responses:
        "200":
          description: Current event settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSettings"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAdminEventSettings
      tags: [admin]
      summary: Update event/organisation settings (admin)
      description: |
        Partial update — any field omitted is left unchanged. Calendar
        timestamps (`eventStartAt`, `eventEndAt`, `socialStartAt`,
        `socialEndAt`) accept ISO-8601 strings, `null`, or empty strings
        (treated as null).
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventSettingsUpdate"
      responses:
        "200":
          description: Updated event settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSettings"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get dashboard stats (admin)
      security:
        - AdminToken: []
      responses:
        "200":
          description: Admin dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ==================== SPONSOR ADMIN ====================
  /admin/sponsors:
    get:
      operationId: listSponsors
      tags: [sponsors-admin]
      summary: List sponsor records with progress and allocation usage
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SponsorStatus" } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Sponsor list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sponsors: { type: array, items: { $ref: "#/components/schemas/SponsorSummary" } }
                required: [sponsors]
    post:
      operationId: createSponsor
      tags: [sponsors-admin]
      summary: Create a draft sponsor record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorUpsert" }
      responses:
        "201":
          description: Draft sponsor created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SponsorWorkspaceAdmin" }
        "409":
          {
            description: Promo code collision,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } },
          }

  /admin/sponsors/{sponsorId}:
    parameters:
      - { $ref: "#/components/parameters/SponsorId" }
    get:
      operationId: getAdminSponsor
      tags: [sponsors-admin]
      summary: Get a complete sponsor administration record
      responses:
        "200":
          {
            description: Sponsor record,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SponsorWorkspaceAdmin" } },
              },
          }
    patch:
      operationId: updateAdminSponsor
      tags: [sponsors-admin]
      summary: Update sponsor details, allocations, contacts, deadlines or status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorUpsert" }
      responses:
        "200":
          {
            description: Updated sponsor,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SponsorWorkspaceAdmin" } },
              },
          }
        "409":
          {
            description: Allocation below active use or promo collision,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } },
          }

  /admin/sponsors/{sponsorId}/confirm:
    post:
      operationId: confirmSponsor
      tags: [sponsors-admin]
      summary: Transactionally confirm a draft sponsor and create codes and checklist
      parameters: [{ $ref: "#/components/parameters/SponsorId" }]
      responses:
        "200":
          {
            description: Confirmed sponsor,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SponsorWorkspaceAdmin" } },
              },
          }
        "409":
          {
            description: Code collision,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } },
          }

  /admin/sponsors/{sponsorId}/access/rotate:
    post:
      operationId: rotateSponsorAccess
      tags: [sponsors-admin]
      summary: Revoke existing sponsor sessions and issue a new private link
      parameters: [{ $ref: "#/components/parameters/SponsorId" }]
      responses:
        "200":
          description: New private link
          content:
            application/json:
              schema:
                type: object
                properties: { accessUrl: { type: string, format: uri } }
                required: [accessUrl]

  /admin/sponsors/{sponsorId}/welcome/preview:
    get:
      operationId: previewSponsorWelcome
      tags: [sponsors-admin]
      summary: Render the sponsor welcome email using current live sponsor data
      parameters: [{ $ref: "#/components/parameters/SponsorId" }]
      responses:
        "200":
          description: Email preview only; no message is sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailPreview" }

  /admin/sponsors/{sponsorId}/welcome/send:
    post:
      operationId: sendSponsorWelcome
      tags: [sponsors-admin]
      summary: Explicitly send the reviewed sponsor welcome email
      parameters: [{ $ref: "#/components/parameters/SponsorId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedPreviewHash:
                  { type: string, description: Hash returned by the preview endpoint }
              required: [expectedPreviewHash]
      responses:
        "200":
          {
            description: Delivery result,
            content:
              {
                application/json:
                  {
                    schema:
                      { type: object, properties: { sent: { type: boolean } }, required: [sent] },
                  },
              },
          }
        "409":
          {
            description: Sponsor data changed after preview,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } },
          }

  /admin/sponsors/{sponsorId}/tasks/{taskId}:
    patch:
      operationId: updateAdminSponsorTask
      tags: [sponsors-admin]
      summary: Update a sponsor deliverable tracker status
      parameters:
        - { $ref: "#/components/parameters/SponsorId" }
        - { name: taskId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { status: { $ref: "#/components/schemas/SponsorTaskStatus" } }
              required: [status]
      responses:
        "200":
          {
            description: Updated tracker item,
            content: { application/json: { schema: { $ref: "#/components/schemas/SponsorTask" } } },
          }

  /admin/sponsors/{sponsorId}/sessions:
    post:
      operationId: addAdminSponsorSessionEntitlement
      tags: [sponsors-admin]
      summary: Add an explicit session entitlement to a sponsor workspace
      parameters: [{ $ref: "#/components/parameters/SponsorId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorSessionEntitlementInput" }
      responses:
        "201":
          {
            description: Sponsor workspace with the new entitlement,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SponsorWorkspaceAdmin" } },
              },
          }

  /admin/sponsors/{sponsorId}/sessions/{sessionId}/entitlement:
    patch:
      operationId: updateAdminSponsorSessionEntitlement
      tags: [sponsors-admin]
      summary: Update a sponsor session entitlement and its required deliverables
      parameters:
        - { $ref: "#/components/parameters/SponsorId" }
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorSessionEntitlementInput" }
      responses:
        "200":
          {
            description: Updated sponsor workspace,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SponsorWorkspaceAdmin" } },
              },
          }

  /admin/sponsors/{sponsorId}/sessions/{sessionId}/review:
    patch:
      operationId: reviewSponsorSession
      tags: [sponsors-admin]
      summary: Approve a submission or request changes with feedback
      parameters:
        - { $ref: "#/components/parameters/SponsorId" }
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [changes_requested, approved] }
                feedback: { type: string, nullable: true }
              required: [status]
      responses:
        "200":
          {
            description: Reviewed session,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SponsorSession" } } },
          }

  /admin/sponsors/{sponsorId}/sessions/export.csv:
    get:
      operationId: exportSponsorSessions
      tags: [sponsors-admin]
      summary: Export approved sponsor sessions and mark their current revisions exported
      parameters: [{ $ref: "#/components/parameters/SponsorId" }]
      responses:
        "200": { description: CSV export, content: { text/csv: { schema: { type: string } } } }

  /admin/sponsors/{sponsorId}/assets:
    get:
      operationId: listSponsorAssets
      tags: [sponsors-admin]
      summary: List all active and archived versions for a sponsor
      parameters:
        - { $ref: "#/components/parameters/SponsorId" }
        - {
            name: category,
            in: query,
            schema: { $ref: "#/components/schemas/SponsorAssetCategory" },
          }
        - { name: status, in: query, schema: { type: string, enum: [active, archived, missing] } }
      responses:
        "200":
          description: Sponsor assets
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      assets: { type: array, items: { $ref: "#/components/schemas/SponsorAsset" } },
                    },
                  required: [assets],
                }
    post:
      operationId: adminUploadSponsorAsset
      tags: [sponsors-admin]
      summary: Upload a validated sponsor file to App Storage
      parameters: [{ $ref: "#/components/parameters/SponsorId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SponsorAssetUpload" }
      responses:
        "201":
          {
            description: Uploaded asset,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SponsorAsset" } } },
          }

  /admin/sponsors/{sponsorId}/assets/{assetId}:
    patch:
      operationId: updateSponsorAssetStatus
      tags: [sponsors-admin]
      summary: Archive or restore an asset version
      parameters:
        - { $ref: "#/components/parameters/SponsorId" }
        - { $ref: "#/components/parameters/AssetId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { status: { type: string, enum: [active, archived] } }
              required: [status]
      responses:
        "200":
          {
            description: Updated asset,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SponsorAsset" } } },
          }

  /admin/sponsors/{sponsorId}/assets/{assetId}/replace:
    post:
      operationId: replaceSponsorAsset
      tags: [sponsors-admin]
      summary: Upload a new version and archive the previous version
      parameters:
        - { $ref: "#/components/parameters/SponsorId" }
        - { $ref: "#/components/parameters/AssetId" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
              required: [file]
      responses:
        "201":
          {
            description: Replacement version,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SponsorAsset" } } },
          }

  /admin/sponsors/{sponsorId}/assets/{assetId}/download:
    get:
      operationId: adminDownloadSponsorAsset
      tags: [sponsors-admin]
      summary: Authenticated individual file download or safe raster preview
      parameters:
        - { $ref: "#/components/parameters/SponsorId" }
        - { $ref: "#/components/parameters/AssetId" }
        - { name: preview, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          {
            description: File stream,
            content: { application/octet-stream: { schema: { type: string, format: binary } } },
          }

  /admin/sponsors/{sponsorId}/assets/download.zip:
    post:
      operationId: downloadSponsorAssetSelection
      tags: [sponsors-admin]
      summary: Stream selected assets as a ZIP with manifest.csv
      parameters: [{ $ref: "#/components/parameters/SponsorId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { assetIds: { type: array, items: { type: string }, minItems: 1 } }
              required: [assetIds]
      responses:
        "200":
          {
            description: ZIP stream,
            content: { application/zip: { schema: { type: string, format: binary } } },
          }
        "409":
          {
            description: Storage metadata drift found before streaming,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } },
          }

  /admin/sponsors/{sponsorId}/assets/complete.zip:
    get:
      operationId: downloadCompleteSponsorFolder
      tags: [sponsors-admin]
      summary: Stream the complete active sponsor folder with manifest.csv
      parameters: [{ $ref: "#/components/parameters/SponsorId" }]
      responses:
        "200":
          {
            description: ZIP stream,
            content: { application/zip: { schema: { type: string, format: binary } } },
          }

  /admin/sponsor-assets:
    get:
      operationId: listAdminSponsorAssetLibrary
      tags: [sponsors-admin]
      summary: Search and filter the all-sponsor asset library
      parameters:
        - { name: sponsorId, in: query, schema: { type: integer } }
        - {
            name: category,
            in: query,
            schema: { $ref: "#/components/schemas/SponsorAssetCategory" },
          }
        - { name: status, in: query, schema: { type: string, enum: [active, archived, missing] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Asset library
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      assets: { type: array, items: { $ref: "#/components/schemas/SponsorAsset" } },
                    },
                  required: [assets],
                }

  /admin/sponsor-assets/backup-plan:
    post:
      operationId: planAllSponsorBackup
      tags: [sponsors-admin]
      summary: Build safe-size ZIP batches for a complete offline backup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                { maxBytesPerZip: { type: integer, minimum: 10485760, default: 524288000 } }
      responses:
        "200":
          description: Download batches
          content:
            application/json:
              schema:
                type: object
                properties:
                  batches:
                    type: array
                    items:
                      type: object
                      properties:
                        sponsorIds: { type: array, items: { type: integer } }
                        byteSize: { type: integer }
                      required: [sponsorIds, byteSize]
                required: [batches]

  /admin/sponsor-assets/backup.zip:
    post:
      operationId: downloadAllSponsorBackupBatch
      tags: [sponsors-admin]
      summary: Stream one planned all-sponsor backup batch without temporary files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { assetIds: { type: array, minItems: 1, items: { type: string } } }
              required: [assetIds]
      responses:
        "200":
          {
            description: ZIP backup stream,
            content: { application/zip: { schema: { type: string, format: binary } } },
          }
        "409":
          {
            description: Batch changed or storage drift found,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } },
          }

  # ==================== PRIVATE SPONSOR WORKSPACE ====================
  /sponsor/access/{token}:
    post:
      operationId: exchangeSponsorAccessToken
      tags: [sponsor-workspace]
      summary: Exchange a private signed link for an HttpOnly SameSite session cookie
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Cookie issued; token should be removed from the visible address }
        "401":
          {
            description: Invalid or revoked link,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } },
          }

  /sponsor/logout:
    post:
      operationId: logoutSponsor
      tags: [sponsor-workspace]
      summary: Clear the sponsor workspace session cookie
      responses: { "204": { description: Logged out } }

  /sponsor/workspace:
    get:
      operationId: getSponsorWorkspace
      tags: [sponsor-workspace]
      summary: Get the private privacy-redacted sponsor workspace
      responses:
        "200":
          {
            description: Sponsor workspace,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SponsorWorkspacePublic" } },
              },
          }

  /sponsor/staff:
    post:
      operationId: registerSponsorStaff
      tags: [sponsor-workspace]
      summary: Explicitly confirm one zero-value Sponsor staff registration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorStaffInput" }
      responses:
        "201":
          {
            description: Registered staff attendee,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SponsorStaff" } } },
          }
        "409":
          {
            description: Allocation full or active email duplicate,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } },
          }

  /sponsor/staff/{bookingId}:
    parameters:
      - { name: bookingId, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateSponsorStaff
      tags: [sponsor-workspace]
      summary: Change or replace a sponsor staff attendee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorStaffInput" }
      responses:
        "200":
          {
            description: Updated attendee,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SponsorStaff" } } },
          }
    delete:
      operationId: cancelSponsorStaff
      tags: [sponsor-workspace]
      summary: Cancel sponsor staff attendance and restore the staff allocation
      responses: { "204": { description: Registration cancelled } }

  /sponsor/pass-requests:
    post:
      operationId: requestMoreSponsorPasses
      tags: [sponsor-workspace]
      summary: Request more VIP or staff places and immediately notify the internal team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestedVip: { type: integer, minimum: 0 }
                requestedStaff: { type: integer, minimum: 0 }
                message: { type: string, maxLength: 2000 }
              required: [requestedVip, requestedStaff]
      responses: { "201": { description: Request recorded } }

  /sponsor/sessions/{sessionId}:
    patch:
      operationId: updateSponsorSession
      tags: [sponsor-workspace]
      summary: Save a sponsor session draft; approved edits return it to submitted
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorSessionInput" }
      responses:
        "200":
          {
            description: Saved session,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SponsorSession" } } },
          }

  /sponsor/sessions/{sessionId}/submit:
    post:
      operationId: submitSponsorSession
      tags: [sponsor-workspace]
      summary: Validate and submit a sponsor session for review
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200":
          {
            description: Submitted session,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SponsorSession" } } },
          }

  /sponsor/assets:
    post:
      operationId: uploadSponsorAsset
      tags: [sponsor-workspace]
      summary: Upload a validated sponsor deliverable to App Storage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SponsorAssetUpload" }
      responses:
        "201":
          {
            description: Uploaded asset,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SponsorAsset" } } },
          }

  /sponsor/assets/{assetId}/replace:
    post:
      operationId: replaceSponsorWorkspaceAsset
      tags: [sponsor-workspace]
      summary: Upload a new version and archive the previous sponsor file
      parameters: [{ $ref: "#/components/parameters/AssetId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
              required: [file]
      responses:
        "201":
          {
            description: Replacement asset,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SponsorAsset" } } },
          }

  /sponsor/assets/{assetId}/download:
    get:
      operationId: downloadSponsorWorkspaceAsset
      tags: [sponsor-workspace]
      summary: Download an authenticated sponsor file
      parameters: [{ $ref: "#/components/parameters/AssetId" }]
      responses:
        "200":
          {
            description: File stream,
            content: { application/octet-stream: { schema: { type: string, format: binary } } },
          }

  /sponsor/documents/{documentId}/acknowledge:
    post:
      operationId: acknowledgeSponsorDocument
      tags: [sponsor-workspace]
      summary: Acknowledge the current version of a required logistics document
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { acknowledgedBy: { type: string, minLength: 2, maxLength: 200 } }
              required: [acknowledgedBy]
      responses: { "201": { description: Current version acknowledged } }

components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: x-admin-token

  parameters:
    SponsorId:
      name: sponsorId
      in: path
      required: true
      schema: { type: integer }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: integer }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string }

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    # ==================== SPONSOR SCHEMAS ====================
    SponsorStatus:
      type: string
      enum: [draft, confirmed, paused, completed, cancelled]

    SponsorAssetCategory:
      type: string
      enum: [logo, headshot, slides, session_material, logistics, other]

    SponsorContact:
      type: object
      properties:
        id: { type: integer }
        role: { type: string, enum: [primary, onsite, marketing, other] }
        firstName: { type: string }
        lastName: { type: string }
        jobTitle: { type: string, nullable: true }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        isPrimary: { type: boolean }
      required: [role, firstName, lastName, email, isPrimary]

    SponsorTask:
      type: object
      properties:
        id: { type: integer }
        taskKey: { type: string }
        label: { type: string }
        required: { type: boolean }
        dueAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [todo, submitted, completed, overdue, not_required] }
        completedAt: { type: string, format: date-time, nullable: true }
      required: [id, taskKey, label, required, status]

    SponsorUsagePerson:
      type: object
      description: Privacy-redacted usage; contact and financial fields are intentionally absent.
      properties:
        bookingId: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        company: { type: string }
        jobTitle: { type: string }
        registeredAt: { type: string, format: date-time }
      required: [bookingId, firstName, lastName, company, jobTitle, registeredAt]

    SponsorCode:
      type: object
      properties:
        kind: { type: string, enum: [vip, public] }
        code: { type: string }
        active: { type: boolean }
        workforceUrl: { type: string, format: uri }
        allocation: { type: integer, nullable: true }
        used: { type: integer }
        remaining: { type: integer, nullable: true }
        maxPerBooking: { type: integer, nullable: true }
        discountPercent: { type: number, nullable: true }
        redemptions: { type: array, items: { $ref: "#/components/schemas/SponsorUsagePerson" } }
      required: [kind, code, active, workforceUrl, used, redemptions]

    SponsorStaff:
      type: object
      properties:
        bookingId: { type: integer }
        attendeeId: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        jobTitle: { type: string }
        company: { type: string }
        workEmail: { type: string, format: email }
        phone: { type: string, nullable: true }
        dietaryAccessibility: { type: string, nullable: true }
        communitySocialAttending: { type: boolean, nullable: true }
        communitySocialDietary: { type: string, nullable: true }
        marketingConsent: { type: boolean }
        status: { type: string }
        registeredAt: { type: string, format: date-time }
      required:
        [
          bookingId,
          attendeeId,
          firstName,
          lastName,
          jobTitle,
          company,
          workEmail,
          marketingConsent,
          status,
          registeredAt,
        ]

    SponsorStaffInput:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        jobTitle: { type: string, minLength: 1, maxLength: 200 }
        company: { type: string, minLength: 1, maxLength: 200 }
        workEmail: { type: string, format: email }
        phone: { type: string, nullable: true, maxLength: 100 }
        dietaryAccessibility: { type: string, nullable: true, maxLength: 2000 }
        communitySocialAttending: { type: boolean, nullable: true }
        communitySocialDietary: { type: string, nullable: true, maxLength: 2000 }
        marketingConsent: { type: boolean, default: false }
      required: [firstName, lastName, jobTitle, company, workEmail]

    SponsorPresenter:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        jobTitle: { type: string }
        company: { type: string }
        biography: { type: string, nullable: true }
        displayOrder: { type: integer }
      required: [name, jobTitle, company]

    SponsorSession:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [quickfire, keynote, other] }
        entitlementLabel: { type: string }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        takeaways: { type: array, maxItems: 3, items: { type: string } }
        status: { type: string, enum: [draft, submitted, changes_requested, approved, exported] }
        feedback: { type: string, nullable: true }
        headshotRequired: { type: boolean }
        takeawaysRequired: { type: boolean }
        slidesRequired: { type: boolean }
        currentRevision: { type: integer }
        exportedRevision: { type: integer, nullable: true }
        exportOutdated: { type: boolean }
        presenters: { type: array, items: { $ref: "#/components/schemas/SponsorPresenter" } }
        revisions:
          type: array
          items:
            type: object
            properties:
              revision: { type: integer }
              actor: { type: string }
              createdAt: { type: string, format: date-time }
            required: [revision, actor, createdAt]
      required:
        [
          id,
          type,
          entitlementLabel,
          takeaways,
          status,
          headshotRequired,
          takeawaysRequired,
          slidesRequired,
          currentRevision,
          exportOutdated,
          presenters,
          revisions,
        ]

    SponsorSessionEntitlementInput:
      type: object
      properties:
        type: { type: string, enum: [quickfire, keynote, other] }
        entitlementLabel: { type: string, minLength: 1, maxLength: 250 }
        headshotRequired: { type: boolean, default: true }
        takeawaysRequired: { type: boolean, default: true }
        slidesRequired: { type: boolean, default: false }
      required: [type, entitlementLabel, headshotRequired, takeawaysRequired, slidesRequired]

    SponsorSessionInput:
      type: object
      properties:
        title: { type: string, maxLength: 250 }
        description: { type: string, maxLength: 1500 }
        takeaways: { type: array, maxItems: 3, items: { type: string, maxLength: 300 } }
        presenters:
          { type: array, minItems: 1, items: { $ref: "#/components/schemas/SponsorPresenter" } }

    SponsorAsset:
      type: object
      properties:
        id: { type: string }
        sponsorId: { type: integer }
        sponsorCompany: { type: string, nullable: true }
        sessionId: { type: integer, nullable: true }
        presenterId: { type: integer, nullable: true }
        category: { $ref: "#/components/schemas/SponsorAssetCategory" }
        originalName: { type: string }
        mimeType: { type: string }
        byteSize: { type: integer }
        checksumSha256: { type: string }
        version: { type: integer }
        status: { type: string, enum: [active, archived, missing] }
        uploaderType: { type: string }
        uploaderLabel: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        previewAvailable: { type: boolean }
      required:
        [
          id,
          sponsorId,
          category,
          originalName,
          mimeType,
          byteSize,
          checksumSha256,
          version,
          status,
          uploaderType,
          createdAt,
          previewAvailable,
        ]

    SponsorAssetUpload:
      type: object
      properties:
        file: { type: string, format: binary }
        category: { $ref: "#/components/schemas/SponsorAssetCategory" }
        sessionId: { type: integer, nullable: true }
        presenterId: { type: integer, nullable: true }
      required: [file, category]

    SponsorDocument:
      type: object
      properties:
        id: { type: integer }
        assetId: { type: string }
        title: { type: string }
        required: { type: boolean }
        acknowledgementVersion: { type: integer }
        acknowledged: { type: boolean }
        acknowledgedBy: { type: string, nullable: true }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
      required: [id, assetId, title, required, acknowledgementVersion, acknowledged]

    SponsorSummary:
      type: object
      properties:
        id: { type: integer }
        company: { type: string }
        packageLabel: { type: string }
        status: { $ref: "#/components/schemas/SponsorStatus" }
        confirmationDate: { type: string, format: date, nullable: true }
        vipAllocation: { type: integer }
        vipUsed: { type: integer }
        staffAllocation: { type: integer }
        staffUsed: { type: integer }
        progressCompleted: { type: integer }
        progressTotal: { type: integer }
        needsAttention: { type: integer }
        updatedAt: { type: string, format: date-time }
      required:
        [
          id,
          company,
          packageLabel,
          status,
          vipAllocation,
          vipUsed,
          staffAllocation,
          staffUsed,
          progressCompleted,
          progressTotal,
          needsAttention,
          updatedAt,
        ]

    SponsorUpsert:
      type: object
      properties:
        company: { type: string, minLength: 1, maxLength: 200 }
        packageLabel: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/SponsorStatus" }
        confirmationDate: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true, maxLength: 10000 }
        vipAllocation: { type: integer, minimum: 0 }
        vipMaxPerBooking: { type: integer, minimum: 1 }
        staffAllocation: { type: integer, minimum: 0 }
        vipCode: { type: string, pattern: "^[A-Z0-9]+$" }
        publicCode: { type: string, pattern: "^[A-Z0-9]+$" }
        contacts: { type: array, items: { $ref: "#/components/schemas/SponsorContact" } }
        tasks: { type: array, items: { $ref: "#/components/schemas/SponsorTask" } }
        sessions:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [quickfire, keynote, other] }
              entitlementLabel: { type: string }
              headshotRequired: { type: boolean }
              takeawaysRequired: { type: boolean }
              slidesRequired: { type: boolean }
            required: [type, entitlementLabel]
      required: [company, packageLabel, vipAllocation, vipMaxPerBooking, staffAllocation]

    SponsorWorkspaceAdmin:
      allOf:
        - { $ref: "#/components/schemas/SponsorSummary" }
        - type: object
          properties:
            notes: { type: string, nullable: true }
            accessUrl: { type: string, format: uri, nullable: true }
            welcomeEmailSentAt: { type: string, format: date-time, nullable: true }
            contacts: { type: array, items: { $ref: "#/components/schemas/SponsorContact" } }
            codes: { type: array, items: { $ref: "#/components/schemas/SponsorCode" } }
            staff: { type: array, items: { $ref: "#/components/schemas/SponsorStaff" } }
            tasks: { type: array, items: { $ref: "#/components/schemas/SponsorTask" } }
            sessions: { type: array, items: { $ref: "#/components/schemas/SponsorSession" } }
            assets: { type: array, items: { $ref: "#/components/schemas/SponsorAsset" } }
            documents: { type: array, items: { $ref: "#/components/schemas/SponsorDocument" } }
            activity: { type: array, items: { type: object, additionalProperties: true } }
          required: [contacts, codes, staff, tasks, sessions, assets, documents, activity]

    SponsorWorkspacePublic:
      type: object
      description: Sponsor-facing projection. Guest emails, phones, payments and revenue are never included.
      properties:
        sponsor: { $ref: "#/components/schemas/SponsorSummary" }
        contacts: { type: array, items: { $ref: "#/components/schemas/SponsorContact" } }
        codes: { type: array, items: { $ref: "#/components/schemas/SponsorCode" } }
        staff: { type: array, items: { $ref: "#/components/schemas/SponsorStaff" } }
        tasks: { type: array, items: { $ref: "#/components/schemas/SponsorTask" } }
        sessions: { type: array, items: { $ref: "#/components/schemas/SponsorSession" } }
        assets: { type: array, items: { $ref: "#/components/schemas/SponsorAsset" } }
        documents: { type: array, items: { $ref: "#/components/schemas/SponsorDocument" } }
        invitationCopy:
          type: object
          properties:
            vip: { type: string }
            public: { type: string }
          required: [vip, public]
      required:
        [sponsor, contacts, codes, staff, tasks, sessions, assets, documents, invitationCopy]

    EmailPreview:
      type: object
      properties:
        to: { type: array, items: { type: string, format: email } }
        subject: { type: string }
        html: { type: string }
        previewHash: { type: string }
      required: [to, subject, html, previewHash]

    # ==================== BOOKING SCHEMAS ====================
    Booking:
      type: object
      properties:
        id:
          type: integer
        sessionToken:
          type: string
        status:
          type: string
          enum:
            [partial, pending_payment, paid, invoiced, transferred, cancelled, refunded, disputed]
        passType:
          type: string
          enum: [single, business]
        attendeeType:
          type: string
          enum: [hr_professional, consultant_vendor]
        quantity:
          type: integer
        promoCode:
          type: ["string", "null"]
        promoDiscountAmount:
          type: ["number", "null"]
        groupDiscountAmount:
          type: ["number", "null"]
        subtotalAmount:
          type: number
        vatAmount:
          type: number
        totalAmount:
          type: number
        paymentMethod:
          type: ["string", "null"]
          enum: ["card", "invoice", null]
        manualEntry:
          type: boolean
        registrationSource:
          type: string
          enum: [checkout, manual, sponsor_staff]
        sponsorId:
          type: ["integer", "null"]
        stripeSessionId:
          type: ["string", "null"]
        stripePaymentIntentId:
          type: ["string", "null"]
        stripeInvoiceId:
          type: ["string", "null"]
        stripeInvoicePdfUrl:
          type: ["string", "null"]
        stripeInvoicePaymentUrl:
          type: ["string", "null"]
        orderReference:
          type: ["string", "null"]
        currentStep:
          type: integer
        billingName:
          type: ["string", "null"]
        billingCompany:
          type: ["string", "null"]
        billingEmail:
          type: ["string", "null"]
        billingAddress:
          type: ["string", "null"]
        billingAddressLine1:
          type: ["string", "null"]
        billingAddressLine2:
          type: ["string", "null"]
        billingTown:
          type: ["string", "null"]
        billingRegion:
          type: ["string", "null"]
        billingPostcode:
          type: ["string", "null"]
        billingCountry:
          type: ["string", "null"]
        billingVatNumber:
          type: ["string", "null"]
        billingPhone:
          type: ["string", "null"]
        poNumber:
          type: ["string", "null"]
        managementToken:
          type: ["string", "null"]
        invoiceDueDate:
          type: ["string", "null"]
          format: date-time
        paidAt:
          type: ["string", "null"]
          format: date-time
        stripeInvoiceStatus:
          type: ["string", "null"]
        stripeInvoiceStatusSyncedAt:
          type: ["string", "null"]
          format: date-time
        invoiceBadgeStatus:
          type: string
          enum: [paid, voided, overdue, sent, pending]
        confirmationEmailSent:
          type: boolean
        welcomeEmailsSent:
          type: boolean
        communitySocialEmailSent:
          type: boolean
        organiserNotified:
          type: boolean
        sheetsSynced:
          type: boolean
        needsAttention:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - sessionToken
        - status
        - passType
        - attendeeType
        - quantity
        - subtotalAmount
        - vatAmount
        - totalAmount
        - manualEntry
        - currentStep
        - createdAt
        - updatedAt

    BookingWithAttendees:
      allOf:
        - $ref: "#/components/schemas/Booking"
        - type: object
          properties:
            attendees:
              type: array
              items:
                $ref: "#/components/schemas/Attendee"
          required:
            - attendees

    AdminBookingWithAttendees:
      allOf:
        - $ref: "#/components/schemas/Booking"
        - type: object
          properties:
            attendees:
              type: array
              items:
                $ref: "#/components/schemas/AdminAttendee"
          required:
            - attendees

    AdminRegistrationStatusUpdateBody:
      type: object
      properties:
        status:
          type: string
          enum:
            [paid, invoiced, transferred, partial, pending_payment, cancelled, refunded, disputed]
      required:
        - status

    AdminRegistrationStatusAction:
      type: string
      enum:
        - refund_issued
        - invoice_voided
        - invoice_paid_out_of_band
        - skipped
        - failed

    AdminRegistrationStatusUpdateResult:
      allOf:
        - $ref: "#/components/schemas/Booking"
        - type: object
          properties:
            stripeAction:
              $ref: "#/components/schemas/AdminRegistrationStatusAction"
          required:
            - stripeAction

    AdminRegistrationStatusErrorResponse:
      type: object
      properties:
        error:
          type: string
        stripeAction:
          type: string
          enum: [failed]
      required:
        - error
        - stripeAction

    ManualRegistrationBody:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        jobTitle:
          type: string
          minLength: 1
        company:
          type: string
          minLength: 1
        workEmail:
          type: string
          format: email
        phone:
          type: ["string", "null"]
        dietaryAccessibility:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
          maxLength: 4000
        passType:
          type: string
